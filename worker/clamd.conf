LocalSocket /run/clamav/clamd.ctl
TCPSocket 3310
TCPAddr 127.0.0.1
User clamav
Foreground false
LogTime yes
LogVerbose no
# Uploads can be 200 MB; the default 25 MB stream limit would silently skip the rest.
StreamMaxLength 210M
MaxFileSize 210M
MaxScanSize 600M
MaxFiles 10000
MaxRecursion 16
ScanArchive yes
ScanPDF yes
AlertBrokenExecutables yes
AlertEncrypted yes
AlertExceedsMax yes
